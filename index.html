<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#A3B8CC">
  <title>Una pregunta para ti</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, "Times New Roman", serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh; margin: 0; overflow-x: hidden; overflow-y: auto; color: #263746;
      background: radial-gradient(circle at 18% 18%, rgb(255 255 255 / 36%), transparent 25%),
                  radial-gradient(circle at 82% 78%, rgb(255 230 235 / 28%), transparent 28%), #A3B8CC;
    }
    .pagina {
      width: 100%; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
      padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
               max(20px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      position: relative; isolation: isolate;
    }
    .corazon {
      position: absolute; color: rgb(255 255 255 / 42%); font-family: Arial, sans-serif;
      font-size: clamp(18px, 3vw, 36px); animation: flotar 6s ease-in-out infinite; z-index: -1;
    }
    .corazon:nth-child(1) { top: 12%; left: 10%; }
    .corazon:nth-child(2) { top: 20%; right: 13%; animation-delay: -2s; }
    .corazon:nth-child(3) { bottom: 13%; left: 17%; animation-delay: -4s; }
    .corazon:nth-child(4) { right: 9%; bottom: 18%; animation-delay: -1s; }
    .tarjeta {
      width: min(100%, 620px); padding: clamp(38px, 9vw, 76px) clamp(24px, 7vw, 64px); text-align: center;
      background: rgb(255 255 255 / 72%); border: 1px solid rgb(255 255 255 / 70%); border-radius: 32px;
      box-shadow: 0 24px 70px rgb(38 55 70 / 22%); backdrop-filter: blur(16px);
      animation: aparecer 900ms cubic-bezier(.2, .8, .2, 1) both;
    }
    .detalle {
      display: inline-block; margin-bottom: 22px; color: #b66b78; font-family: Arial, sans-serif;
      font-size: 28px; animation: latido 2s ease-in-out infinite;
    }
    h1 {
      max-width: 500px; margin: 0 auto; font-size: clamp(34px, 10vw, 62px); font-weight: 500;
      line-height: 1.08; letter-spacing: -.035em;
    }
    .subtitulo {
      margin: 20px auto 32px; color: #526779; font-family: Arial, sans-serif;
      font-size: clamp(15px, 2.4vw, 18px); line-height: 1.6;
    }
    button {
      min-width: 170px; min-height: 52px; padding: 15px 28px; border: 0; border-radius: 999px; background: #263746; color: #fff;
      font: 600 16px/1 Arial, sans-serif; letter-spacing: .02em; cursor: pointer;
      box-shadow: 0 10px 24px rgb(38 55 70 / 24%);
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }
    button:hover { transform: translateY(-3px); background: #354b5e; box-shadow: 0 14px 28px rgb(38 55 70 / 30%); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .tarjeta.saliendo { animation: salir 450ms ease forwards; }
    @keyframes aparecer { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes salir { to { opacity: 0; transform: translateY(-18px) scale(.98); } }
    @keyframes flotar { 50% { transform: translateY(-14px) rotate(7deg); } }
    @keyframes latido { 50% { transform: scale(1.15); } }
    @media (max-width: 420px) {
      .pagina { place-items: center; }
      .tarjeta { border-radius: 26px; box-shadow: 0 18px 50px rgb(38 55 70 / 20%); }
      .detalle { margin-bottom: 18px; font-size: 25px; }
      .subtitulo { margin: 18px auto 28px; line-height: 1.5; }
      button { width: 100%; max-width: 280px; }
      .corazon:nth-child(2), .corazon:nth-child(3) { display: none; }
    }
    @media (max-height: 560px) and (orientation: landscape) {
      .pagina { padding-top: 14px; padding-bottom: 14px; }
      .tarjeta { width: min(100%, 680px); padding: 24px 38px; }
      .detalle { margin-bottom: 8px; font-size: 22px; }
      h1 { font-size: clamp(29px, 7vh, 44px); }
      .subtitulo { margin: 10px auto 18px; font-size: 14px; }
      button { min-height: 46px; padding-block: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="pagina">
    <span class="corazon" aria-hidden="true">♥</span>
    <span class="corazon" aria-hidden="true">♥</span>
    <span class="corazon" aria-hidden="true">♥</span>
    <span class="corazon" aria-hidden="true">♥</span>
    <section class="tarjeta" id="tarjeta">
      <span class="detalle" aria-hidden="true">♥</span>
      <h1>Tengo una pregunta importante para ti…</h1>
      <p class="subtitulo">Pero antes, quiero enseñarte algo que preparé con mucho cariño.</p>
      <button type="button" id="continuar">Continuar&nbsp; →</button>
    </section>
  </main>
  <script>
    const tarjeta = document.querySelector('#tarjeta');
    document.querySelector('#continuar').addEventListener('click', () => {
      tarjeta.classList.add('saliendo');
      setTimeout(() => {
        tarjeta.innerHTML = `
          <span class="detalle" aria-hidden="true">♥</span>
          <h1>Todo empieza con nosotros…</h1>
          <p class="subtitulo">Aquí vamos a colocar vuestros recuerdos y momentos especiales.</p>
          <button type="button" onclick="location.reload()">← Volver</button>`;
        tarjeta.classList.remove('saliendo');
        void tarjeta.offsetWidth;
        tarjeta.style.animation = 'aparecer 700ms cubic-bezier(.2, .8, .2, 1) both';
      }, 450);
    });
  </script>
</body>
</html>
